<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Text to Image</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="input-group">
      <input type="text" id="imageUrl" placeholder="Enter text for image">
      <button id="createBtn">Create Image</button>
    </div>
    <div class="filter-bar">
      <button class="filter-btn active" data-filter="new">New</button>
      <button class="filter-btn" data-filter="hot">Hot</button>
      <button class="filter-btn" data-filter="recent">Recently Viewed</button>
      <button class="filter-btn" data-filter="yours">Your Creations</button>
    </div>
    <div id="imageContainer"></div>
  </div>

  <!-- Modal -->
  <div id="viewersModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <div class="modal-title">Image Details</div>
        <button id="closeModal" class="close-button">&times;</button>
      </div>
      
      <div class="modal-tabs">
        <div class="modal-tab active" data-section="viewersList">Viewers</div>
        <div class="modal-tab" data-section="commentsSection">Comments</div>
      </div>
      
      <div id="viewersList" class="modal-content-section viewers-list active"></div>
      
      <div id="commentsSection" class="modal-content-section">
        <div id="commentsList" class="comments-section"></div>
        <div class="comment-input">
          <input type="text" id="commentInput" placeholder="Write a comment...">
          <button onclick="submitComment()">Send</button>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>

</body>
</html>
